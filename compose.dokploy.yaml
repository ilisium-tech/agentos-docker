
services:
  agentos:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000

    expose:
      - "8000"

    environment:
      RUNTIME_ENV: prd
      AGNO_DEBUG: "False"
      WAIT_FOR_DB: "True"

      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AGENTOS_URL: ${AGENTOS_URL}
      JWT_VERIFICATION_KEY: ${JWT_VERIFICATION_KEY}
      MCP_CONNECT_SECRET: ${MCP_CONNECT_SECRET}

      DB_HOST: agentos-postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_DATABASE: ${DB_DATABASE}

    networks:
      - dokploy-network

    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

networks:
  dokploy-network:
    external: true
